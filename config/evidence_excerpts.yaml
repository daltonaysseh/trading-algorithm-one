# Real excerpts backing the 10 calibration scores, keyed by ticker/quarter.
# Used by both the Rubric page (one excerpt per dimension, the clearest
# illustrative case found in the calibration batch) and the Tickers page
# (1-2 excerpts per ticker justifying its most notable score). All text
# is verbatim from data/raw/transcripts/ -- read in full before scoring,
# per the "pair scores with real excerpts" instruction this session.

# One excerpt per dimension for the Rubric page.
rubric_dimension_examples:
  guidance:
    ticker: SXI
    quarter: "Q1 2026"
    score: 85
    speaker: "David Dunbar, Chairman & CEO"
    excerpt: >
      "We are raising our fiscal Year 2026 sales outlook. Barring unforeseen
      economic, global trade, or tariffs-related disruptions, we now expect
      revenue to grow by over $110 million. $10 million more than we
      communicated last quarter."
    why: >
      A specific, numbered raise to forward guidance -- the clearest
      strong-guidance example in the calibration batch.

  hedging:
    ticker: PBF
    quarter: "Q3 2025"
    score: 30
    speaker: "Joe Marino, CFO"
    excerpt: >
      "That's an interesting question. Obviously, there'd be a lot of
      different factors playing into the market... I think it's hard to
      specifically answer that question down to a fine detail... We don't
      have an exact impact of what that would look like at this point."
    why: >
      Asked directly to normalize net debt for one-time items, twice --
      answered both times with qualifiers instead of a number. The clearest
      low-hedging-score example (i.e. heavily hedged language) in the batch.

  qa_directness:
    ticker: WSFS
    quarter: "Q3 2025"
    score: 90
    speaker: "David Burg, CFO"
    excerpt: >
      "I would characterize that as about 3 basis points per 25 basis point
      rate cut... when you think about the net interest margin this quarter,
      we were at 3.91. We had the one interest recovery. If you kind of
      normalize for that, we're in the high 3.80s. With a couple of few rate
      cuts that go into the fourth quarter, we would tick down to maybe
      about 3.80."
    why: >
      A margin-sensitivity question answered with exact basis-point figures
      and a worked-through calculation, not a general statement.

  consistency:
    ticker: PBF
    quarter: "Q3 2025"
    score: 20
    speaker: "Matt Lucey, CEO (prepared remarks) vs. Joe Marino, CFO (Q&A)"
    excerpt: >
      Prepared remarks: "...all of which should come together to create a
      dynamic environment for the company and our shareholders."
      Q&A (same call, same underlying question asked twice): "It's hard to
      put a fine point on that... we don't have an exact impact of what that
      would look like at this point."
    why: >
      The clearest prepared-remarks-vs-Q&A divergence in the batch --
      confident, upbeat framing in the scripted portion, evasive on the one
      specific number analysts pressed for in Q&A. Exactly the pattern the
      consistency dimension is designed to catch.

  headwinds:
    ticker: MTX
    quarter: "Q3 2025"
    score: 85
    speaker: "Erik Aldag, CFO"
    excerpt: >
      "Versus the third quarter last year, we've done well to offset $10
      million of higher costs, including tariff costs, raw material
      increases, energy, and temporary increases like higher logistics
      costs associated with our U.S. cat litter plant upgrade."
    why: >
      Risks named specifically and quantified in dollar terms, rather than
      described generically -- the rubric's 80-anchor for headwinds.

